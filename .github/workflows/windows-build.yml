name: windows-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript + frontend build
        run: npm run build

      - name: cargo fmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # --lib: the admin manifest applies to every bin, so the CLI test harness
      # cannot execute on an unelevated runner (see CLAUDE.md, CLI section).
      - name: cargo test
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Install Pester 5+
        shell: powershell
        run: Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser

      # Tweak round trips run in a throwaway HKCU hive; service/appx/power
      # integration tests are gated behind DSSO_KBF_INTEGRATION and stay off.
      - name: Pester tests
        shell: powershell
        run: |
          $result = Invoke-Pester tests\pester -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) { exit 1 }

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Tauri release build (NSIS installer)
        run: npm run tauri build

      # TODO(phase 7+): sign the exe + installer with Azure Trusted Signing here
      # (azure/trusted-signing-action) so SmartScreen / Smart App Control do not
      # block users. Until then the artifacts are unsigned.

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dsso-kbf-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload portable exes
        uses: actions/upload-artifact@v4
        with:
          name: dsso-kbf-portable
          path: |
            src-tauri/target/release/dsso-kbf.exe
            src-tauri/target/release/dsso-cli.exe
